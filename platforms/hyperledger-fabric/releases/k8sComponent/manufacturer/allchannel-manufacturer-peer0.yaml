global:
  version: 2.2.2
  serviceAccountName: vault-auth
  cluster:
    provider: minikube
    cloudNativeServices: false
  vault:
    type: hashicorp
    network: fabric
    address: http://192.168.0.107:8200
    authPath: localmanufacturer
    secretEngine: secretsv2
    secretPrefix: "data/localmanufacturer"
    role: vault-role
    tls: false
  proxy:
    provider: none
    externalUrlSuffix: develop.local.com

image:
  fabricTools: ghcr.io/hyperledger/bevel-fabric-tools
  alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
  pullSecret: ""

peer:
  name: peer0
  type: anchor
  address: peer0.manufacturer-net:7051
  localMspId: manufacturerMSP
  logLevel: debug
  tlsStatus: true
  channelName: allchannel  
  ordererAddress: orderer1.supplychain-net:7050
  addPeerValue: false
  addnewOrgValue: false

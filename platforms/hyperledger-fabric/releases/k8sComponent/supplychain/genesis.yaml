global:
  version: 2.2.2
  serviceAccountName: vault-auth
  cluster:
    provider: minikube
    cloudNativeServices: false
  vault:
    type: hashicorp
    network: fabric
    address: http://192.168.0.107:8200
    authPath: localsupplychain
    secretEngine: secretsv2
    secretPrefix: "data/localsupplychain"
    role: vault-role
    tls: false
  proxy:
    provider: none
    externalUrlSuffix: develop.local.com

image:
  alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
  fabricTools: ghcr.io/hyperledger/bevel-fabric-tools
  pullSecret: ""

organizations:
  - name: supplychain
    orderers:
    - name: orderer1
      ordererAddress: orderer1.supplychain-net:7050
  - name: manufacturer
    peers:
    - name: peer0
      peerAddress: peer0.manufacturer-net:7051
  - name: carrier
    peers:
    - name: peer0
      peerAddress: peer0.carrier-net:7051

consensus: raft


channels:
 
 
  - name: allchannel
    consortium: SupplyChainConsortium
    orderers: 
      - supplychain
    participants:
      - carrier
      - manufacturer

settings:
  generateGenesis: True 
  removeConfigMapOnDelete: false

add_new_org: false
newOrgs:
  - name: supplychain
  - name: manufacturer
  - name: carrier
